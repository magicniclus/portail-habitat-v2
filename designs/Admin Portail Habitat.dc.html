<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broadsheet-158321e5-ae38-4de9-bd95-ae149a3cad1b/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body { margin: 0; background: #f6f6f4; font-family: "Source Sans 3", system-ui, sans-serif; color: #201e1d; }
h1, h2, h3 { font-family: "Source Sans 3", system-ui, sans-serif; letter-spacing: -0.015em; }
a { color: #2a323c; }
a:hover { color: #3f4a57; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #3f4a57; outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed !important; }
</style>
</helmet>

<div style="min-height:100vh;display:grid;grid-template-columns:auto minmax(0,1fr);font-family:'Source Sans 3',system-ui,sans-serif">
  <aside style="background:#2a323c;color:#e6e9ed;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;transition:width .28s cubic-bezier(.4,0,.2,1);width:{{ asideW }}">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 8px 18px;min-width:0">
      <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true" style="flex:none"><path d="M5 19.5 20 7l15 12.5" fill="none" stroke="#c3c9d1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M9 21.5V33h22V21.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="17" y="25" width="6" height="8" rx="1" fill="#c3c9d1"></rect></svg>
      <span style="font-size:13px;font-weight:700;letter-spacing:0.06em;line-height:1.2;white-space:nowrap;transition:opacity .2s ease .06s, transform .28s cubic-bezier(.4,0,.2,1);opacity:{{ lblOp }};transform:{{ lblTr }}">PORTAIL HABITAT<br><span style="color:#aab3be;letter-spacing:0.18em">ADMIN</span></span>
    </div>

    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="15">
      <button onClick="{{ n.go }}" title="{{ n.nom }}" aria-label="{{ n.nom }}" style="position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;cursor:pointer;font:inherit;text-align:left;padding:9px 12px;border-radius:8px;font-size:14.5px;white-space:nowrap;height:auto;line-height:1.3;flex:none;font-weight:{{ n.fw }};color:{{ n.fg }};background:{{ n.bg }}" style-hover="background:#3a4450">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{ n.d }}"></path></svg>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s ease .06s, transform .28s cubic-bezier(.4,0,.2,1);opacity:{{ lblOp }};transform:{{ lblTr }}">{{ n.nom }}</span>
        <span style="font-size:12px;font-weight:700;color:#aab3be;transition:opacity .2s;opacity:{{ lblOp }}">{{ n.badge }}</span>
        <sc-if value="{{ n.dot }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:7px;left:28px;width:8px;height:8px;border-radius:99px;background:#f28c28;box-shadow:0 0 0 2px #2a323c"></span></sc-if>
      </button>
    </sc-for>
    <div style="margin-top:auto;padding:14px 4px 0;display:flex;flex-direction:column;gap:8px;border-top:1px solid #3a4450">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <span title="{{ user.nom }}" style="flex:none;width:36px;height:36px;border-radius:99px;background:#3f4a57;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">JM</span>
        <span style="display:flex;flex-direction:column;gap:1px;min-width:0;white-space:nowrap;transition:opacity .2s ease .06s;opacity:{{ lblOp }}"><span style="font-size:14px;font-weight:700">{{ user.nom }}</span><span style="font-size:12.5px;color:#aab3be">{{ user.email }} · MFA ✓</span></span>
      </div>
      <sc-if value="{{ ouvert }}" hint-placeholder-val="{{ true }}">
        <label style="font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#aab3be;white-space:nowrap">Aperçu en tant que</label>
        <select onChange="{{ changeRole }}" value="{{ role }}" style="font:inherit;font-size:14px;padding:7px 8px;border-radius:8px;border:1px solid #4a5561;background:#343e49;color:#fff">
          <sc-for list="{{ roles }}" as="r" hint-placeholder-count="6"><option value="{{ r.id }}">{{ r.nom }}</option></sc-for>
        </select>
        <span style="font-size:12px;line-height:1.4;color:#aab3be">{{ roleDesc }}</span>
      </sc-if>
    </div>
  </aside>

  <main style="min-width:0;padding:0 clamp(16px,3vw,36px) 60px;display:flex;flex-direction:column;gap:16px">
    <header style="position:sticky;top:0;z-index:30;background:#f6f6f4;border-bottom:1px solid #e2e0dc;margin:0 calc(-1 * clamp(16px,3vw,36px));padding:12px clamp(16px,3vw,36px);display:flex;align-items:center;gap:14px">
      <button type="button" onClick="{{ basculer }}" aria-label="{{ basculerLabel }}" title="{{ basculerLabel }}" aria-expanded="{{ ouvert }}" style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid #d9d6d1;background:#fff;border-radius:8px;cursor:pointer;color:#3d3a37;flex:none;padding:0" style-hover="background:#eef0f3">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="transition:transform .28s cubic-bezier(.4,0,.2,1);transform:{{ chevron }}"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path d="m14 9 3 3-3 3"></path></svg>
      </button>
      <p style="margin:0;font-size:17px;font-weight:700">{{ titreSection }}</p>
    </header>
    <sc-if value="{{ showIaBtn }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ goIa }}" style="position:fixed;right:24px;bottom:24px;z-index:40;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;font:inherit;font-size:15px;font-weight:700;padding:12px 18px;border-radius:999px;background:#2a323c;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;height:auto" style-hover="background:#3f4a57">✦ Audit IA conversion</button>
    </sc-if>
    <sc-if value="{{ pii }}" hint-placeholder-val="{{ false }}">
      <div style="padding:10px 14px;border-radius:10px;background:#fdf4e3;color:#7a5206;font-size:14px;font-weight:600">Rôle « lecture » : données personnelles masquées, aucune action d'écriture.</div>
    </sc-if>
    <sc-if value="{{ s.dashboard }}" hint-placeholder-val="{{ true }}"><dc-import name="Admin Tableau de bord" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.file }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin File" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.artisans }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Artisans" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.demandes }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Demandes" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.leads }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Appels d offres" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.avis }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Avis" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.litiges }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Litiges" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.finances }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Finances" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.conversion }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Conversion" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.comportement }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Comportement" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,800px"></dc-import></sc-if>
    <sc-if value="{{ s.ia }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin IA" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,800px"></dc-import></sc-if>
    <sc-if value="{{ s.referentiels }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Referentiels" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.algorithme }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Algorithme" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.contenus }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Contenus" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.equipe }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin Equipe" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ s.rgpd }}" hint-placeholder-val="{{ false }}"><dc-import name="Admin RGPD" perms="{{ perms }}" pii="{{ pii }}" go="{{ goTo }}" hint-size="100%,700px"></dc-import></sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CATALOGUE = ['artisans.lire', 'artisans.creer', 'artisans.modifier', 'artisans.verifier', 'artisans.suspendre', 'artisans.supprimer', 'documents.valider', 'avis.lire', 'avis.moderer', 'avis.supprimer', 'demandes.lire', 'demandes.reattribuer', 'demandes.annuler', 'leads.lire', 'leads.publier', 'leads.prix', 'leads.prix_illimite', 'leads.offrir', 'leads.rembourser', 'credits.crediter', 'credits.crediter_illimite', 'finances.lire', 'finances.exporter', 'finances.rembourser_carte', 'promos.gerer', 'conversion.lire', 'conversion.piloter', 'conversion.configurer', 'referentiels.lire', 'referentiels.modifier', 'communes.modifier', 'matching.lire', 'matching.config', 'matching.forcer', 'litiges.lire', 'litiges.traiter', 'contacts.traiter', 'annonces.gerer', 'comportement.lire', 'comportement.replays', 'comportement.configurer', 'ia.utiliser', 'ia.configurer', 'equipe.gerer', 'audit.lire', 'rgpd.traiter'];
const LECTURE = CATALOGUE.filter((p) => p.endsWith('.lire') && p !== 'audit.lire');
const ROLES = {
  superadmin: { nom: 'Superadmin', desc: 'Tout, y compris l’équipe et l’algorithme.', p: CATALOGUE },
  admin: { nom: 'Admin (opérations)', desc: 'Tout sauf l’équipe et la suppression définitive.', p: CATALOGUE.filter((p) => !['equipe.gerer', 'artisans.supprimer', 'avis.supprimer'].includes(p)) },
  moderateur: { nom: 'Modérateur', desc: 'Avis, documents, litiges, contacts.', p: ['artisans.lire', 'artisans.verifier', 'documents.valider', 'avis.lire', 'avis.moderer', 'demandes.lire', 'leads.lire', 'leads.rembourser', 'litiges.lire', 'litiges.traiter', 'contacts.traiter'] },
  commercial: { nom: 'Commercial', desc: 'Artisans en lecture, promos, gestes ≤ 5 crédits, conversion.', p: ['artisans.lire', 'demandes.lire', 'leads.lire', 'leads.prix', 'leads.offrir', 'credits.crediter', 'promos.gerer', 'conversion.lire', 'conversion.piloter', 'finances.lire', 'comportement.lire', 'comportement.replays', 'ia.utiliser'] },
  finance: { nom: 'Finance', desc: 'Factures, achats, remboursements, exports.', p: ['artisans.lire', 'leads.lire', 'finances.lire', 'finances.exporter', 'finances.rembourser_carte', 'conversion.lire'] },
  lecture: { nom: 'Lecture seule', desc: 'Lecture seule, données personnelles masquées.', p: LECTURE },
};
const SECTIONS = [
  ['dashboard', 'Tableau de bord', null, ''], ['ia', 'Audit IA conversion', ['ia.utiliser', 'ia.configurer'], ''], ['file', 'File de travail', ['documents.valider', 'avis.moderer', 'contacts.traiter', 'litiges.traiter', 'conversion.piloter'], '17'],
  ['artisans', 'Artisans', ['artisans.lire'], ''], ['demandes', 'Demandes', ['demandes.lire'], ''], ['leads', 'Appels d’offres', ['leads.lire'], '3'],
  ['avis', 'Avis', ['avis.lire'], '4'], ['litiges', 'Litiges', ['litiges.lire'], '2'], ['finances', 'Finances', ['finances.lire'], ''],
  ['conversion', 'Conversion', ['conversion.lire'], '6'], ['comportement', 'Comportement', ['comportement.lire'], '5'], ['referentiels', 'Référentiels', ['referentiels.lire'], ''], ['algorithme', 'Algorithme', ['matching.lire'], ''],
  ['contenus', 'Contenus', ['annonces.gerer', 'referentiels.lire'], ''], ['equipe', 'Équipe et audit', ['equipe.gerer', 'audit.lire'], ''], ['rgpd', 'RGPD', ['rgpd.traiter'], '1'],
];

const ICO = {
  dashboard: 'M3 11 12 4l9 7M6 12.5V20h12v-7.5', ia: 'M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M6.3 17.7l2.5-2.5M15.2 8.8l2.5-2.5',
  file: 'M4 13h4l2 3h4l2-3h4M4 13l2-8h12l2 8v6H4z', artisans: 'M16 20v-2a4 4 0 0 0-8 0v2M12 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM20 20v-1.5a3 3 0 0 0-2.5-3M17 5.3a3 3 0 0 1 0 5.4',
  demandes: 'M4 6h16v10H9l-5 3V6z', leads: 'M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 8.5a4 4 0 0 1 0 7M18 6a8 8 0 0 1 0 12',
  avis: 'm12 3.8 2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4-3.9 5.6-.8z', litiges: 'M12 4v16M7 20h10M5 8h14M5 8l-3 6a3 3 0 0 0 6 0zM19 8l-3 6a3 3 0 0 0 6 0z',
  finances: 'M4 7h16v10H4zM4 11h16M8 15h3', conversion: 'M3 5h18l-7 8v6l-4-2v-4z', comportement: 'M5 3l14 7-6 2-2 6z',
  referentiels: 'M4 6h16M4 12h16M4 18h10', algorithme: 'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',
  contenus: 'M5 4h10l4 4v12H5zM14 4v5h5M8 13h8M8 17h5', equipe: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', rgpd: 'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',
};

class Component extends DCLogic {
  state = { ouvert: (() => { try { return localStorage.getItem('ph-admin-menu') !== 'replie'; } catch (e) { return true; } })(), section: (typeof location !== 'undefined' && location.hash.slice(1)) || 'dashboard', role: 'superadmin' };
  componentDidMount() { this.onHash = () => { const h = location.hash.slice(1); if (h && h !== this.state.section) this.setState({ section: h }); }; window.addEventListener('hashchange', this.onHash); }
  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); }
  renderVals() {
    const { section, role } = this.state;
    const R = ROLES[role];
    const perms = Object.fromEntries(CATALOGUE.map((p) => [p, R.p.includes(p)]));
    const visible = SECTIONS.filter(([, , need]) => !need || need.some((p) => perms[p]));
    const cur = visible.find((x) => x[0] === section) ? section : 'dashboard';
    const goTo = (id) => { this.setState({ section: id }); try { history.replaceState(null, '', '#' + id); } catch (e) {} window.scrollTo({ top: 0 }); };
    return {
      nav: visible.map(([id, nom, , badge]) => ({ nom, badge, d: ICO[id] || ICO.dashboard, dot: !this.state.ouvert && !!badge, fw: id === cur ? 700 : 500, fg: id === cur ? '#fff' : '#c9cfd6', bg: id === cur ? '#3f4a57' : 'transparent', go: () => goTo(id) })),
      s: Object.fromEntries(SECTIONS.map(([id]) => [id, id === cur])),
      perms, pii: role === 'lecture', role, goTo,
      roles: Object.entries(ROLES).map(([id, r]) => ({ id, nom: r.nom })),
      roleDesc: R.desc,
      changeRole: (e) => this.setState({ role: e.target.value }),
      ouvert: this.state.ouvert, asideW: this.state.ouvert ? '248px' : '72px', lblOp: this.state.ouvert ? 1 : 0, lblTr: this.state.ouvert ? 'translateX(0)' : 'translateX(-6px)', chevron: this.state.ouvert ? 'rotate(180deg)' : 'rotate(0deg)', titreSection: (visible.find((x) => x[0] === cur) || [, 'Tableau de bord'])[1],
      basculerLabel: this.state.ouvert ? 'Replier le menu' : 'Déplier le menu',
      basculer: () => this.setState((st) => { const o = !st.ouvert; try { localStorage.setItem('ph-admin-menu', o ? 'ouvert' : 'replie'); } catch (e) {} return { ouvert: o }; }),
      showIaBtn: cur !== 'ia' && (perms['ia.utiliser'] || perms['ia.configurer']), goIa: () => goTo('ia'),
      user: { nom: 'Julie Martin', email: 'julie@portailhabitat.fr' },
    };
  }
}
</script>
</body>
</html>
