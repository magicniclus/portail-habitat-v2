name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verifications:
    name: Format, lint, types, Knip, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Les émulateurs Firebase ont besoin de Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright (iPhone 13, iPhone SE, Pixel 7, ordinateur)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ph/web exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: apps/web/playwright-report
          retention-days: 7

  e2e-pro:
    name: Playwright espace pro (émulateurs + seed)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEED_MOT_DE_PASSE: MotDePasse-e2e-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Les émulateurs Firebase ont besoin de Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulateurs-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ph/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @ph/web build
      - run: pnpm e2e:pro
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright-pro
          path: apps/web/playwright-report
          retention-days: 7

  catalogue:
    name: Storybook et catalogue (4 thèmes, 320 px, cibles, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ph/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @ph/ui build-storybook
      - run: pnpm --filter @ph/ui catalogue

  lighthouse:
    name: Lighthouse mobile (budget EXPLOITATION §1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@ph/web
      - run: pnpm --filter @ph/web lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-lighthouse
          path: apps/web/.lighthouseci/rapports
          retention-days: 7
