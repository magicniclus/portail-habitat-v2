<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broadsheet-158321e5-ae38-4de9-bd95-ae149a3cad1b/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body { margin: 0; font-family: "Source Sans 3", system-ui, sans-serif; } h1, h2, h3 { font-family: "Source Sans 3", system-ui, sans-serif; letter-spacing: -0.015em; } a { color: #2a323c; } a:hover { color: #3f4a57; } button:disabled, input:disabled, select:disabled, textarea:disabled { opacity: .45; cursor: not-allowed !important; }</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:18px;min-width:0;font-family:'Source Sans 3',system-ui,sans-serif;color:#201e1d">
  <header><h1 style="margin:0;font-size:30px;line-height:1.15">Contenus</h1><p style="margin:4px 0 0;font-size:15px;color:#57534f">Annonces in-app, pages légales.</p></header>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start">
    <section style="background:#fff;border:1px solid #e7e5e1;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px">
      <h2 style="margin:0 0 6px;font-size:18px">Annonces in-app</h2>
      <sc-for list="{{ annonces }}" as="a" hint-placeholder-count="3">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #ecebe7">
          <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14.5px;font-weight:600">{{ a.texte }}</span><span style="font-size:13px;color:#6b6763">{{ a.cible }} · {{ a.periode }}</span></span>
          <button onClick="{{ a.suppr }}" disabled="{{ noAnn }}" style="border:0;background:none;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;color:#8f1d14;padding:0;height:auto;white-space:nowrap">Supprimer</button>
        </div>
      </sc-for>
      <div style="display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid #ecebe7">
        <textarea value="{{ nv.texte }}" onChange="{{ setTexte }}" disabled="{{ noAnn }}" rows="2" placeholder="Texte de l'annonce" style="font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid #d9d6d1;border-radius:8px;resize:vertical"></textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select value="{{ nv.cible }}" onChange="{{ setCible }}" disabled="{{ noAnn }}" style="font:inherit;font-size:14px;padding:7px 8px;border:1px solid #d9d6d1;border-radius:8px;background:#fff"><option>Tous les artisans</option><option>Artisans gratuits</option><option>Artisans Premium</option><option>Particuliers</option></select>
          <input value="{{ nv.periode }}" onChange="{{ setPeriode }}" disabled="{{ noAnn }}" placeholder="du 01/10 au 15/10" style="font:inherit;font-size:14px;padding:7px 10px;border:1px solid #d9d6d1;border-radius:8px">
          <button onClick="{{ publier }}" disabled="{{ noPub }}" title="{{ annTitle }}" class="btn btn-primary" style="font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;height:auto;line-height:1.3;background:#3f4a57;border-color:#3f4a57;color:#fff">Programmer</button>
        </div>
      </div>
    </section>
    <section style="background:#fff;border:1px solid #e7e5e1;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px">
      <h2 style="margin:0 0 6px;font-size:18px">Pages légales</h2>
      <sc-for list="{{ legales }}" as="l" hint-placeholder-count="4">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #ecebe7;flex-wrap:wrap"><span style="display:flex;flex-direction:column;gap:1px"><span style="font-size:14.5px;font-weight:600">{{ l.nom }}</span><span style="font-size:13px;color:#6b6763">v{{ l.v }} · mise à jour le {{ l.date }}</span></span><button onClick="{{ l.go }}" disabled="{{ noAnn }}" class="btn btn-secondary" style="font:inherit;font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;height:auto;line-height:1.3">Nouvelle version</button></div>
      </sc-for>
      <p style="margin:6px 0 0;font-size:13px;color:#6b6763">Une nouvelle version des CGU ou CGV demande une nouvelle acceptation à la connexion suivante.</p>
    </section>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}"><div role="status" style="position:fixed;bottom:20px;right:20px;z-index:60;background:#2a323c;color:#fff;padding:12px 16px;border-radius:10px;font-size:14.5px;max-width:420px">{{ toast }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { annonces: [['Nouveau : répondez aux demandes depuis l’application mobile', 'Tous les artisans', 'du 20/09 au 10/10'], ['Maintenance le 3 octobre de 6 h à 7 h', 'Tous les artisans', 'du 01/10 au 03/10']], nv: { texte: '', cible: 'Tous les artisans', periode: '' }, leg: [['CGU', 4, '12/09/2026'], ['CGV Pro', 3, '12/09/2026'], ['Politique de confidentialité', 5, '01/09/2026'], ['Politique d’avis', 2, '15/07/2026']], toast: '' };
  flash(t) { this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 3200); }
  renderVals() {
    if (!this.props.go && !this._redir) { this._redir = 1; setTimeout(() => { try { location.replace('Admin Portail Habitat.dc.html#contenus'); } catch (e) {} }, 0); }
    const s = this.state, P = this.props.perms || {}, lect = !!this.props.pii, can = (p) => P[p] ?? true;
    const noAnn = lect || !can('annonces.gerer');
    return {
      annonces: s.annonces.map(([texte, cible, periode], i) => ({ texte, cible, periode, suppr: () => { this.setState({ annonces: s.annonces.filter((_, k) => k !== i) }); this.flash('Annonce supprimée'); } })),
      nv: s.nv, noAnn, noPub: noAnn || !s.nv.texte.trim() || !s.nv.periode.trim(), annTitle: can('annonces.gerer') ? '' : 'Permission requise : annonces.gerer',
      setTexte: (e) => this.setState({ nv: { ...s.nv, texte: e.target.value } }), setCible: (e) => this.setState({ nv: { ...s.nv, cible: e.target.value } }), setPeriode: (e) => this.setState({ nv: { ...s.nv, periode: e.target.value } }),
      publier: () => { this.setState({ annonces: [...s.annonces, [s.nv.texte, s.nv.cible, s.nv.periode]], nv: { texte: '', cible: 'Tous les artisans', periode: '' } }); this.flash('Annonce programmée'); },
      legales: s.leg.map(([nom, v, date], i) => ({ nom, v, date, go: () => { this.setState({ leg: s.leg.map((l, k) => (k === i ? [l[0], l[1] + 1, '26/09/2026'] : l)) }); this.flash(nom + ' v' + (v + 1) + ' publiée · acceptation redemandée'); } })),
      toast: s.toast, hasToast: !!s.toast,
    };
  }
}
</script>
</body>
</html>
