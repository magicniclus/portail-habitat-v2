<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broadsheet-158321e5-ae38-4de9-bd95-ae149a3cad1b/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>body { margin: 0; font-family: "Source Sans 3", system-ui, sans-serif; } h1, h2, h3 { font-family: "Source Sans 3", system-ui, sans-serif; letter-spacing: -0.015em; } a { color: #2a323c; } a:hover { color: #3f4a57; } button:disabled { opacity: .45; cursor: not-allowed !important; }</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:18px;min-width:0;font-family:'Source Sans 3',system-ui,sans-serif;color:#201e1d">
  <header><h1 style="margin:0;font-size:30px;line-height:1.15">Demandes et dossiers diagnostic</h1><p style="margin:4px 0 0;font-size:15px;color:#57534f">Avec la trace complète de l'algorithme de mise en relation.</p></header>
  <div style="display:flex;flex-wrap:wrap;gap:6px">
    <sc-for list="{{ filtres }}" as="f" hint-placeholder-count="5"><button onClick="{{ f.go }}" style="border:1px solid #d9d6d1;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;padding:6px 11px;border-radius:999px;white-space:nowrap;height:auto;line-height:1.3;background:{{ f.bg }};color:{{ f.fg }}">{{ f.nom }}</button></sc-for>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;align-items:start">
    <section style="background:#fff;border:1px solid #e7e5e1;border-radius:12px;overflow:hidden">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
        <button onClick="{{ r.go }}" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid #ecebe7;cursor:pointer;font:inherit;padding:12px 16px;height:auto;background:{{ r.sel }}" style-hover="background:#f4f5f7">
          <span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:13px;color:#6b6763;font-family:ui-monospace,Menlo,monospace">{{ r.ref }} · {{ r.date }}</span><span style="font-size:15px;font-weight:600">{{ r.projet }}</span><span style="font-size:13px;color:#6b6763">{{ r.lieu }} · {{ r.budget }}</span></span>
          <span style="font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:{{ r.bg }};color:{{ r.fg }}">{{ r.statut }}</span>
        </button>
      </sc-for>
    </section>
    <section style="background:#fff;border:1px solid #e7e5e1;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px">
      <div><div style="font-size:13px;color:#6b6763;font-family:ui-monospace,Menlo,monospace">{{ d.ref }}</div><h2 style="margin:2px 0 0;font-size:21px">{{ d.projet }}</h2><div style="font-size:14px;color:#6b6763">{{ d.lieu }} · {{ d.budget }} · particulier {{ d.client }}</div></div>
      <h3 style="margin:4px 0 0;font-size:16px">Trace de l'algorithme · <code style="font-size:13px">matching/{{ d.ref }}</code></h3>
      <div style="display:flex;flex-direction:column">
        <sc-for list="{{ candidats }}" as="c" hint-placeholder-count="5">
          <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid #ecebe7">
            <span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:14.5px;font-weight:600">{{ c.nom }}</span><span style="font-size:13px;color:#6b6763">{{ c.detail }}</span></span>
            <span style="display:flex;flex-direction:column;align-items:flex-end;gap:3px"><span style="font-size:15px;font-weight:700">{{ c.score }}</span><span style="font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:{{ c.bg }};color:{{ c.fg }}">{{ c.res }}</span></span>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:6px;border-top:1px solid #ecebe7">
        <sc-for list="{{ actions }}" as="x" hint-placeholder-count="5"><button onClick="{{ x.go }}" disabled="{{ x.off }}" title="{{ x.title }}" class="btn btn-secondary" style="font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;height:auto;line-height:1.3;color:{{ x.c }}">{{ x.nom }}</button></sc-for>
      </div>
    </section>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}"><div role="status" style="position:fixed;bottom:20px;right:20px;z-index:60;background:#2a323c;color:#fff;padding:12px 16px;border-radius:10px;font-size:14.5px;max-width:420px">{{ toast }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const T = { green: ['#eef7f3', '#085340'], amber: ['#fdf4e3', '#7a5206'], red: ['#fdecea', '#8f1d14'], grey: ['#f1f0ed', '#57534f'], blue: ['#eef4fa', '#0d3a65'] };
const DEM = [
  ['PH-4K82Q9', '26/09 09:12', 'Rénovation de salle de bain', 'Bordeaux Caudéran', '7 800 – 10 400 €', 'Mise en relation', 'green', 'Camille M.'],
  ['PH-4K91A2', '26/09 18:02', 'Tableau électrique', 'Lormont', '2 400 – 3 200 €', 'Sans preneur', 'amber', 'Marc L.'],
  ['PH-4K77B0', '25/09 16:40', 'Isolation de combles', 'Pessac', '3 100 – 4 200 €', 'Appel d’offres', 'blue', 'Nadia R.'],
  ['PHD-7R21', '25/09 11:05', 'Diagnostics vente (5)', 'Cenon', '420 – 560 €', 'Mise en relation', 'green', 'Pierre L.'],
  ['PH-4K60C3', '24/09 08:31', 'Peinture 3 pièces', 'Talence', '2 900 – 3 800 €', 'Spam', 'red', '—'],
  ['PH-4K55D8', '23/09 19:14', 'Pompe à chaleur air-eau', 'Mérignac', '11 000 – 15 500 €', 'Exclusive Premium', 'blue', 'Luc D.'],
];
const CAND = [
  ['Bertrand Rénovation', 'Premium · 6 km · réponse 1 h 40 · quota 2/4', '0,91', 'Retenu (exclusif)', 'green'],
  ['Isolation Gironde', 'Premium · 9 km · métier secondaire', '0,78', 'Retenu', 'green'],
  ['Toitures Rive Droite', 'Visibilité · 11 km', '0,71', 'Retenu', 'green'],
  ['Atelier Garnier', '14 km · taux de réponse 71 %', '0,52', 'Écarté : score < 0,6', 'grey'],
  ['Carrelage Nguyen', '4 km', '—', 'Exclu : non vérifié', 'red'],
  ['Rénov Express 33', '3 km', '—', 'Exclu : suspendu', 'red'],
];
const FILTRES = ['Toutes', 'Mise en relation', 'Sans preneur', 'Appel d’offres', 'Exclusive Premium', 'Spam'];
class Component extends DCLogic {
  state = { f: 'Toutes', sel: 'PH-4K82Q9', over: {}, toast: '' };
  flash(t) { this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 3200); }
  renderVals() {
    if (!this.props.go && !this._redir) { this._redir = 1; setTimeout(() => { try { location.replace('Admin Portail Habitat.dc.html#demandes'); } catch (e) {} }, 0); }
    const s = this.state, P = this.props.perms || {}, can = (p) => P[p] ?? true, lect = !!this.props.pii;
    const dem = DEM.map((d) => (s.over[d[0]] ? [...d.slice(0, 5), ...s.over[d[0]], d[7]] : d));
    const list = dem.filter((d) => s.f === 'Toutes' || d[5] === s.f);
    const d = dem.find((x) => x[0] === s.sel) || dem[0];
    const set = (statut, tone, msg) => { this.setState({ over: { ...s.over, [d[0]]: [statut, tone] } }); this.flash(msg + ' · auditLog écrit'); };
    const act = (nom, perm, go, c) => ({ nom, off: lect || !can(perm), title: can(perm) ? '' : 'Permission requise : ' + perm, go, c: c || '#201e1d' });
    return {
      filtres: FILTRES.map((f) => ({ nom: f, bg: f === s.f ? '#2a323c' : '#fff', fg: f === s.f ? '#fff' : '#201e1d', go: () => this.setState({ f }) })),
      rows: list.map((x) => ({ ref: x[0], date: x[1], projet: x[2], lieu: x[3], budget: x[4], statut: x[5], bg: T[x[6]][0], fg: T[x[6]][1], sel: x[0] === d[0] ? '#f4f5f7' : '#fff', go: () => this.setState({ sel: x[0] }) })),
      d: { ref: d[0], projet: d[2], lieu: d[3], budget: d[4], client: lect ? '•••' : d[7] },
      candidats: CAND.map(([nom, detail, score, res, tone]) => ({ nom, detail, score, res, bg: T[tone][0], fg: T[tone][1] })),
      actions: [
        act('Réattribuer', 'demandes.reattribuer', () => this.flash('Choisissez un artisan à ajouter ou retirer (adminReattribuer)')),
        act('Relancer l’algorithme', 'matching.forcer', () => this.flash('Algorithme relancé · nouvelle trace matching/' + d[0])),
        act('Convertir en appel d’offres', 'leads.publier', () => set('Appel d’offres', 'blue', 'Converti en appel d’offres')),
        act('Marquer comme spam', 'demandes.annuler', () => set('Spam', 'red', 'Marquée comme spam'), '#8f1d14'),
        act('Annuler', 'demandes.annuler', () => set('Annulée', 'grey', 'Demande annulée, particulier prévenu'), '#8f1d14'),
      ],
      toast: s.toast, hasToast: !!s.toast,
    };
  }
}
</script>
</body>
</html>
